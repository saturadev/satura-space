name: ci

on:
  pull_request:
    paths-ignore:
      - '**.md'
      - '.github/media/**'
      - '.github/ISSUE_TEMPLATE/**'
      - 'LICENSE'
      - 'NOTICE'
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.github/media/**'
      - '.github/ISSUE_TEMPLATE/**'
      - 'LICENSE'
      - 'NOTICE'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'

jobs:
  orchestrator:
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/orchestrator
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      - name: Install
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: corepack pnpm@10.34.9 install --frozen-lockfile
      - name: Typecheck
        run: corepack pnpm@10.34.9 typecheck

  mcp:
    runs-on: macos-15
    timeout-minutes: 20
    defaults:
      run:
        working-directory: packages/mcp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -r requirements.txt
      - name: Compile
        run: python -m compileall -q server.py unity_mcp

  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: packages/companion-app/relay
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      - name: Install
        run: corepack pnpm@10.34.9 install --frozen-lockfile
      - name: Syntax check
        run: for f in src/*.mjs scripts/*.mjs; do node --check "$f"; done
